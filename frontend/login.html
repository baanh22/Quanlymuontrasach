<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập | Quản Lý Nhà Sách</title>
    <meta name="description" content="Đăng nhập vào hệ thống quản lý nhà sách">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 0 20px;
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-logo .logo-icon {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 20px;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 30px; margin-bottom: 16px;
            box-shadow: 0 8px 32px rgba(79,70,229,0.4);
        }
        .login-logo h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
        .login-logo p  { color: var(--text-muted); font-size: 14px; }
        .login-card { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--dark-border); border-radius: 20px; padding: 36px; }
        .login-card .form-group { margin-bottom: 20px; }
        .login-card label { display: block; font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .input-icon { position: relative; }
        .input-icon i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; }
        .input-icon input { padding-left: 40px; }
        .btn-login { width: 100%; padding: 14px; font-size: 15px; font-weight: 600; margin-top: 8px; background: linear-gradient(135deg, var(--primary), #6366f1); border: none; border-radius: 12px; color: white; cursor: pointer; transition: all 0.3s; }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(79,70,229,0.4); }
        .btn-login:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        .error-msg { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; border-radius: 10px; padding: 12px 16px; font-size: 13px; margin-bottom: 16px; display: none; }
        .error-msg.show { display: flex; align-items: center; gap: 8px; }
        .login-footer { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-logo">
            <div class="logo-icon"><i class="fa-solid fa-book-open"></i></div>
            <h1>Quản Lý Nhà Sách</h1>
            <p>Hệ thống quản lý hiện đại</p>
        </div>
        <div class="login-card">
            <div id="errorMsg" class="error-msg">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="errorText"></span>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="username" class="form-control" placeholder="Nhập tên đăng nhập" required autocomplete="username">
                    </div>
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu" required autocomplete="current-password">
                    </div>
                </div>
                <button type="submit" id="loginBtn" class="btn-login">
                    <i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập
                </button>
            </form>
        </div>
        <div class="login-footer">
            <i class="fa-solid fa-shield-halved"></i> Hệ thống an toàn & bảo mật
        </div>
    </div>

    <script>
        const API_BASE = '/Quanlymuontrasach/api';

        // Nếu đã đăng nhập → redirect
        fetch(API_BASE + '/auth.php?action=me', { credentials: 'include' })
            .then(r => r.json())
            .then(d => { if (d.success) window.location.href = 'index.html'; })
            .catch(() => {});

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errDiv = document.getElementById('errorMsg');
            const errText = document.getElementById('errorText');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang xử lý...';
            errDiv.classList.remove('show');

            try {
                const res = await fetch(API_BASE + '/auth.php?action=login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();
                if (data.success) {
                    btn.innerHTML = '<i class="fa-solid fa-check"></i> Thành công!';
                    setTimeout(() => window.location.href = 'index.html', 500);
                } else {
                    errText.textContent = data.message;
                    errDiv.classList.add('show');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập';
                }
            } catch (err) {
                errText.textContent = 'Không thể kết nối đến máy chủ. Kiểm tra XAMPP.';
                errDiv.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập';
            }
        });
    </script>
</body>
</html>
