openapi: 3.0.3
info:
  title: Hệ Thống Quản Lý Nhà Sách RESTful API
  description: |
    Tài liệu đặc tả API Contract (OpenAPI 3.0) cho hệ thống Quản lý Nhà sách (`Quanlymuontrasach`).
    Tuân thủ Clean Layered Architecture (`Controllers -> Services -> Repositories -> Models`) và 4 Quy định nghiệp vụ cốt lõi (QĐ1 - QĐ4).
  version: 2.0.0
servers:
  - url: http://localhost/Quanlymuontrasach/api
    description: XAMPP Localhost Server
  - url: http://localhost:8080/Quanlymuontrasach/api
    description: Docker Container Server

tags:
  - name: Auth
    description: Xác thực phiên đăng nhập (Session-based Authentication)
  - name: Sach
    description: Quản lý danh mục đầu sách và tồn kho
  - name: KhachHang
    description: Quản lý thông tin khách hàng và dư nợ
  - name: NhapSach
    description: Lập phiếu nhập sách theo Quy định 1 (QĐ1)
  - name: HoaDon
    description: Lập hóa đơn bán sách theo Quy định 2 (QĐ2)
  - name: PhieuThu
    description: Lập phiếu thu tiền nợ theo Quy định 3 (QĐ3)
  - name: BaoCao
    description: Báo cáo tồn kho, Báo cáo công nợ & Thống kê Dashboard
  - name: HeThong
    description: Quản trị nhân viên (RBAC) & Cấu hình tham số động theo Quy định 4 (QĐ4)

paths:
  /auth.php:
    post:
      tags: [Auth]
      summary: Đăng nhập hoặc Đăng xuất (qua query param ?action=login|logout)
      parameters:
        - in: query
          name: action
          required: true
          schema:
            type: string
            enum: [login, logout]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: admin
      responses:
        '200':
          description: Đăng nhập / Đăng xuất thành công
        '401':
          description: Sai tên đăng nhập hoặc mật khẩu
    get:
      tags: [Auth]
      summary: Lấy thông tin người dùng hiện tại (?action=me)
      parameters:
        - in: query
          name: action
          required: true
          schema:
            type: string
            enum: [me]
      responses:
        '200':
          description: Thông tin phiên đăng nhập hợp lệ
        '401':
          description: Chưa đăng nhập

  /sach.php:
    get:
      tags: [Sach]
      summary: Lấy danh sách sách hoặc tìm kiếm theo Tên/Tác giả/Thể loại
      parameters:
        - in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: Danh sách đầu sách
    post:
      tags: [Sach]
      summary: Thêm đầu sách mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SachInput'
      responses:
        '200':
          description: Thêm sách thành công
        '400':
          description: Trùng mã sách hoặc thiếu thông tin
    put:
      tags: [Sach]
      summary: Cập nhật thông tin sách
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SachInput'
      responses:
        '200':
          description: Cập nhật thành công
    delete:
      tags: [Sach]
      summary: Xóa sách (chặn xóa nếu đã có Hóa đơn hoặc Phiếu nhập)
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Xóa thành công
        '400':
          description: Không thể xóa sách đã phát sinh giao dịch

  /nhapsach.php:
    get:
      tags: [NhapSach]
      summary: Lấy lịch sử phiếu nhập sách
      responses:
        '200':
          description: Danh sách phiếu nhập
    post:
      tags: [NhapSach]
      summary: Lập phiếu nhập sách mới (Kiểm tra QĐ1)
      description: |
        - Kiểm tra `SoLuong >= SoLuongNhapItNhat` (mặc định 150)
        - Kiểm tra `SoLuongTon < SoLuongTonToiDaTruocNhap` (mặc định 300)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [MaSach, SoLuong, DonGia]
              properties:
                MaSach:
                  type: string
                  example: S001
                SoLuong:
                  type: integer
                  example: 150
                DonGia:
                  type: number
                  example: 85000
      responses:
        '200':
          description: Lập phiếu nhập thành công, cập nhật tồn kho và đơn giá
        '400':
          description: Vi phạm quy định QĐ1

  /hoadon.php:
    get:
      tags: [HoaDon]
      summary: Lấy lịch sử hóa đơn bán hàng
      responses:
        '200':
          description: Danh sách hóa đơn kèm tổng tiền lịch sử
    post:
      tags: [HoaDon]
      summary: Lập hóa đơn bán sách (Kiểm tra QĐ2)
      description: |
        - Kiểm tra `SoTienNo <= SoTienNoToiDa` (mặc định 20,000đ)
        - Kiểm tra `(SoLuongTon - SoLuong) >= SoLuongTonSauToiThieu` (mặc định 20 cuốn)
        - Tự động tính `DonGiaBan = DonGia * DonGiaBanYeuCau` (mặc định 105%) và lưu vào `CHITIETPHIEUHOADON`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [MaKhachHang, MaSach, SoLuong]
              properties:
                MaKhachHang:
                  type: string
                  example: KH001
                MaSach:
                  type: string
                  example: S001
                SoLuong:
                  type: integer
                  example: 5
      responses:
        '200':
          description: Lập hóa đơn thành công, trừ tồn kho và cộng nợ khách hàng
        '400':
          description: Vi phạm quy định QĐ2

  /phieuthu.php:
    get:
      tags: [PhieuThu]
      summary: Lấy lịch sử phiếu thu tiền
      responses:
        '200':
          description: Danh sách phiếu thu
    post:
      tags: [PhieuThu]
      summary: Lập phiếu thu tiền nợ khách hàng (Kiểm tra QĐ3)
      description: |
        - Nếu `QuyDinh == 1`: Kiểm tra `SoTienThu <= SoTienNo` hiện tại của khách hàng.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [MaKhachHang, SoTienThu]
              properties:
                MaKhachHang:
                  type: string
                  example: KH002
                SoTienThu:
                  type: number
                  example: 15000
      responses:
        '200':
          description: Thu tiền thành công, khấu trừ nợ tức thì
        '400':
          description: Vi phạm quy định QĐ3 (Thu vượt số tiền đang nợ)

  /baocao.php:
    get:
      tags: [BaoCao]
      summary: Xuất báo cáo Tồn kho hoặc Công nợ theo Tháng/Năm
      parameters:
        - in: query
          name: type
          required: true
          schema:
            type: string
            enum: [tonkho, congno]
        - in: query
          name: thang
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - in: query
          name: nam
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Dữ liệu báo cáo tổng hợp

  /cauhinh.php:
    get:
      tags: [HeThong]
      summary: Lấy bộ tham số quy định hiện hành (QĐ1 - QĐ4)
      responses:
        '200':
          description: Thông tin cấu hình THAMSO
    put:
      tags: [HeThong]
      summary: Cập nhật quy định tham số (Chỉ dành cho Admin - QĐ4)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThamSoInput'
      responses:
        '200':
          description: Cập nhật quy định thành công
        '403':
          description: Không có quyền Admin

components:
  schemas:
    SachInput:
      type: object
      required: [MaSach, TenSach]
      properties:
        MaSach:
          type: string
        TenSach:
          type: string
        TheLoai:
          type: string
        TacGia:
          type: string
        SoLuongTon:
          type: integer
        DonGia:
          type: number
    ThamSoInput:
      type: object
      required: [SoLuongNhapItNhat, SoLuongTonToiDaTruocNhap, SoTienNoToiDa, SoLuongTonSauToiThieu]
      properties:
        SoLuongNhapItNhat:
          type: integer
          example: 150
        SoLuongTonToiDaTruocNhap:
          type: integer
          example: 300
        SoTienNoToiDa:
          type: number
          example: 20000
        SoLuongTonSauToiThieu:
          type: integer
          example: 20
        DonGiaBanYeuCau:
          type: number
          example: 1.05
        QuyDinh:
          type: integer
          enum: [0, 1]
          example: 1

